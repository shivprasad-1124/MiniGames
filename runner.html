<!-- I’ll build the game as one standalone HTML file, first checking the workspace for the intended location, then implementing the canvas game, controls, scoring, collision logic, responsive layout, and a quick browser-oriented sanity check.```html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desert Dash</title>
  <style>
    :root {
      --ink: #1c2028;
      --muted: #657080;
      --paper: #fffdf7;
      --line: #d9d4c8;
      --accent: #ef6c4d;
      --accent-dark: #c84d34;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.8), transparent 25%),
        linear-gradient(135deg, #f3ead5 0%, #f8f4ea 48%, #e8e0cf 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .shell {
      width: min(1100px, 94vw);
    }

    .game-card {
      position: relative;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 22px;
      background: var(--paper);
      box-shadow:
        12px 14px 0 rgba(28, 32, 40, 0.12),
        0 24px 60px rgba(28, 32, 40, 0.16);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 22px 14px;
      border-bottom: 2px solid var(--ink);
      background: rgba(255, 253, 247, 0.92);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--accent);
      color: var(--paper);
      font-size: 20px;
      line-height: 1;
      transform: rotate(-9deg);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 25px);
      letter-spacing: -0.04em;
    }

    .brand p {
      margin: 1px 0 0;
      color: var(--muted);
      font: 600 10px/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 18px;
      font: 700 12px/1 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .score-item {
      display: grid;
      gap: 5px;
      text-align: right;
    }

    .score-item span {
      color: var(--muted);
      font-size: 9px;
    }

    .score-item strong {
      font-size: 17px;
      letter-spacing: 0.04em;
    }

    .canvas-wrap {
      position: relative;
      background: #dceef0;
    }

    canvas {
      display: block;
      width: 100%;
      height: min(62vh, 570px);
      min-height: 330px;
      cursor: pointer;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(254, 251, 242, 0.74);
      backdrop-filter: blur(4px);
      transition: opacity 180ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      width: min(430px, 100%);
      padding: 30px 28px 26px;
      border: 2px solid var(--ink);
      border-radius: 18px;
      background: rgba(255, 253, 247, 0.96);
      box-shadow: 7px 8px 0 rgba(28, 32, 40, 0.15);
      text-align: center;
    }

    .panel .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-dark);
      font: 800 11px/1 Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .panel h2 {
      margin: 0;
      font-size: clamp(31px, 6vw, 52px);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .panel p {
      margin: 17px auto 23px;
      max-width: 320px;
      color: var(--muted);
      font: 14px/1.55 Arial, sans-serif;
    }

    button {
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 13px 27px;
      background: var(--accent);
      color: #fffaf0;
      cursor: pointer;
      font: 800 12px/1 Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 4px 5px 0 var(--ink);
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    button:hover {
      background: #f27858;
    }

    button:active {
      transform: translate(3px, 4px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .help {
      display: flex;
      justify-content: center;
      gap: 22px;
      padding: 13px 20px 16px;
      color: var(--muted);
      font: 600 11px/1 Arial, sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .key {
      display: inline-block;
      min-width: 24px;
      margin-right: 4px;
      padding: 3px 5px;
      border: 1px solid #aaa395;
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #f5f0e6;
      color: var(--ink);
      font-size: 10px;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 13px 15px;
      }

      .brand p {
        display: none;
      }

      .scoreboard {
        gap: 10px;
      }

      .score-item strong {
        font-size: 14px;
      }

      .help {
        gap: 10px;
        font-size: 9px;
      }

      canvas {
        height: min(62vh, 470px);
        min-height: 310px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="game-card">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div>
            <h1>Desert Dash</h1>
            <p>Endless runner</p>
          </div>
        </div>

        <div class="scoreboard">
          <div class="score-item">
            <span>Score</span>
            <strong id="score">00000</strong>
          </div>
          <div class="score-item">
            <span>Best</span>
            <strong id="best">00000</strong>
          </div>
        </div>
      </header>

      <div class="canvas-wrap">
        <canvas id="game" aria-label="Desert Dash game"></canvas>

        <div class="overlay" id="overlay">
          <div class="panel">
            <p class="eyebrow" id="panelEyebrow">A tiny desert adventure</p>
            <h2 id="panelTitle">Desert Dash</h2>
            <p id="panelText">
              Jump over cacti, dodge the birds, and keep running until the horizon runs out.
            </p>
            <button id="startButton">Start Running</button>
          </div>
        </div>
      </div>

      <footer class="help">
        <span><span class="key">Space</span> Jump</span>
        <span><span class="key">↓</span> Duck</span>
        <span><span class="key">P</span> Pause</span>
      </footer>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const panelEyebrow = document.getElementById("panelEyebrow");
      const panelTitle = document.getElementById("panelTitle");
      const panelText = document.getElementById("panelText");
      const startButton = document.getElementById("startButton");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("best");

      const TAU = Math.PI * 2;
      const DPR = Math.min(window.devicePixelRatio || 1, 2);

      let width = 0;
      let height = 0;
      let groundY = 0;
      let lastTime = 0;
      let animationFrame = 0;
      let state = "ready";
      let score = 0;
      let best = Number(localStorage.getItem("desert-dash-best") || 0);
      let speed = 360;
      let distance = 0;
      let spawnTimer = 0;
      let dustTimer = 0;
      let night = false;
      let audioContext = null;

      const player = {
        x: 110,
        y: 0,
        width: 48,
        height: 48,
        velocityY: 0,
        grounded: true,
        ducking: false,
        blink: 0
      };

      const obstacles = [];
      const particles = [];
      const clouds = [];
      const stars = [];

      bestElement.textContent = formatScore(best);

      function formatScore(value) {
        return String(Math.floor(value)).padStart(5, "0");
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        canvas.width = Math.floor(width * DPR);
        canvas.height = Math.floor(height * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        groundY = height - Math.max(54, height * 0.16);
        player.x = Math.max(58, width * 0.14);

        if (player.grounded) {
          player.y = groundY - player.height;
        }

        if (clouds.length === 0) {
          for (let i = 0; i < 8; i++) {
            clouds.push({
              x: Math.random() * width,
              y: 35 + Math.random() * height * 0.35,
              scale: 0.45 + Math.random() * 0.85,
              speed: 8 + Math.random() * 16
            });
          }
        }

        if (stars.length === 0) {
          for (let i = 0; i < 70; i++) {
            stars.push({
              x: Math.random(),
              y: Math.random() * 0.55,
              size: 0.5 + Math.random() * 1.5,
              alpha: 0.35 + Math.random() * 0.65
            });
          }
        }
      }

      function showOverlay(mode) {
        overlay.classList.remove("hidden");

        if (mode === "ready") {
          panelEyebrow.textContent = "A tiny desert adventure";
          panelTitle.textContent = "Desert Dash";
          panelText.textContent =
            "Jump over cacti, dodge the birds, and keep running until the horizon runs out.";
          startButton.textContent = "Start Running";
        } else if (mode === "paused") {
          panelEyebrow.textContent = "Time is standing still";
          panelTitle.textContent = "Paused";
          panelText.textContent = "Take a breath. Your run is waiting exactly where you left it.";
          startButton.textContent = "Resume";
        } else {
          panelEyebrow.textContent = "The desert wins this round";
          panelTitle.textContent = "Run Over";
          panelText.textContent = `You reached ${formatScore(score)} points. Ready to chase a new record?`;
          startButton.textContent = "Run Again";
        }
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function resetGame() {
        score = 0;
        speed = 360;
        distance = 0;
        spawnTimer = 0.8;
        dustTimer = 0;
        night = false;
        obstacles.length = 0;
        particles.length = 0;
        player.height = 48;
        player.velocityY = 0;
        player.grounded = true;
        player.ducking = false;
        player.y = groundY - player.height;
        updateScore();
      }

      function startGame() {
        resetGame();
        state = "running";
        hideOverlay();
        playSound("start");
      }

      function endGame() {
        state = "gameover";
        best = Math.max(best, Math.floor(score));
        localStorage.setItem("desert-dash-best", best);
        bestElement.textContent = formatScore(best);
        burst(player.x + player.width / 2, player.y + player.height / 2, "#ef6c4d", 18);
        playSound("hit");
        showOverlay("gameover");
      }

      function togglePause() {
        if (state === "running") {
          state = "paused";
          showOverlay("paused");
        } else if (state === "paused") {
          state = "running";
          hideOverlay();
        }
      }

      function jump() {
        if (state === "ready" || state === "gameover") {
          startGame();
          return;
        }

        if (state !== "running") return;

        if (player.grounded) {
          player.velocityY = -760;
          player.grounded = false;
          burst(player.x + 15, groundY - 2, "#fff0bd", 5);
          playSound("jump");
        }
      }

      function setDuck(value) {
        if (state !== "running") return;
        player.ducking = value && player.grounded;
      }

      function spawnObstacle() {
        const bird = Math.random() < Math.min(0.25, score / 1800);
        const obstacle = {
          type: bird ? "bird" : "cactus",
          x: width + 50,
          y: 0,
          width: bird ? 50 : 30 + Math.random() * 18,
          height: bird ? 27 : 38 + Math.random() * 28,
          phase: Math.random() * TAU
        };

        obstacle.y = bird
          ? groundY - 78 - Math.random() * 52
          : groundY - obstacle.height;

        obstacles.push(obstacle);
        spawnTimer = bird ? 1.15 + Math.random() * 1.1 : 0.7 + Math.random() * 1.25;
      }

      function update(dt) {
        distance += speed * dt;
        speed = Math.min(720, 360 + distance * 0.018);
        score += dt * speed * 0.045;
        night = Math.floor(score / 700) % 2 === 1;

        spawnTimer -= dt;
        if (spawnTimer <= 0) spawnObstacle();

        dustTimer -= dt;
        if (dustTimer <= 0 && player.grounded) {
          dustTimer = 0.08;
          burst(player.x + 4, groundY - 2, night ? "#d6d7d0" : "#ead8b4", 1);
        }

        player.blink -= dt;
        if (player.blink <= 0) player.blink = 3 + Math.random() * 4;

        const targetHeight = player.ducking ? 29 : 48;
        if (player.height !== targetHeight) {
          const bottom = player.y + player.height;
          player.height += (targetHeight - player.height) * Math.min(1, dt * 18);
          player.y = bottom - player.height;
        }

        player.velocityY += 2100 * dt;
        player.y += player.velocityY * dt;

        if (player.y + player.height >= groundY) {
          player.y = groundY - player.height;
          player.velocityY = 0;
          player.grounded = true;
        } else {
          player.grounded = false;
        }

        for (const cloud of clouds) {
          cloud.x -= cloud.speed * dt;
          if (cloud.x < -120) {
            cloud.x = width + 120;
            cloud.y = 35 + Math.random() * height * 0.35;
          }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obstacle = obstacles[i];
          obstacle.x -= speed * dt;

          if (obstacle.type === "bird") {
            obstacle.phase += dt * 9;
            obstacle.y += Math.sin(obstacle.phase) * 0.2;
          }

          if (obstacle.x + obstacle.width < -60) {
            obstacles.splice(i, 1);
          } else if (collides(player, obstacle)) {
            endGame();
            return;
          }
        }

        updateParticles(dt);
        updateScore();
      }

      function collides(a, b) {
        const ax = a.x + 8;
        const ay = a.y + 5;
        const aw = a.width - 15;
        const ah = a.height - 8;
        const bx = b.x + 4;
        const by = b.y + 3;
        const bw = b.width - 8;
        const bh = b.height - 5;

        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 480 * dt;
          particle.size *= 0.99;

          if (particle.life <= 0) particles.splice(i, 1);
        }
      }

      function burst(x, y, color, amount) {
        for (let i = 0; i < amount; i++) {
          particles.push({
            x,
            y,
            vx: -30 - Math.random() * 90,
            vy: -30 - Math.random() * 130,
            size: 2 + Math.random() * 4,
            life: 0.3 + Math.random() * 0.45,
            color
          });
        }
      }

      function updateScore() {
        scoreElement.textContent = formatScore(score);
      }

      function draw() {
        drawBackground();
        drawClouds();
        drawDistantDunes();
        drawGround();

        for (const obstacle of obstacles) {
          if (obstacle.type === "bird") drawBird(obstacle);
          else drawCactus(obstacle);
        }

        drawPlayer();
        drawParticles();
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        if (night) {
          gradient.addColorStop(0, "#1b2743");
          gradient.addColorStop(1, "#526a76");
        } else {
          gradient.addColorStop(0, "#a8d9e0");
          gradient.addColorStop(1, "#f7d99a");
        }

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        if (night) {
          ctx.fillStyle = "#f9e7a9";
          ctx.beginPath();
          ctx.arc(width * 0.78, height * 0.19, 34, 0, TAU);
          ctx.fill();

          ctx.fillStyle = "#263451";
          ctx.beginPath();
          ctx.arc(width * 0.8, height * 0.17, 31, 0, TAU);
          ctx.fill();

          for (const star of stars) {
            ctx.globalAlpha = star.alpha;
            ctx.fillStyle = "#fff6d2";
            ctx.fillRect(star.x * width, star.y * height, star.size, star.size);
          }
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = "#fff1ba";
          ctx.beginPath();
          ctx.arc(width * 0.78, height * 0.19, 35, 0, TAU);
          ctx.fill();
        }
      }

      function drawClouds() {
        ctx.fillStyle = night ? "rgba(115, 137, 152, 0.28)" : "rgba(255, 255, 255, 0.55)";

        for (const cloud of clouds) {
          ctx.save();
          ctx.translate(cloud.x, cloud.y);
          ctx.scale(cloud.scale, cloud.scale);
          ctx.beginPath();
          ctx.arc(0, 12, 15, 0, TAU);
          ctx.arc(19, 5, 22, 0, TAU);
          ctx.arc(45, 13, 15, 0, TAU);
          ctx.roundRect(-14, 12, 73, 19, 10);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawDistantDunes() {
        ctx.fillStyle = night ? "#394c5c" : "#e9bf82";
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.quadraticCurveTo(width * 0.18, groundY - 80, width * 0.38, groundY);
        ctx.quadraticCurveTo(width * 0.6, groundY - 120, width * 0.84, groundY);
        ctx.lineTo(width, groundY);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = night ? "#465d68" : "#f1cb8a";
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.quadraticCurveTo(width * 0.24, groundY - 48, width * 0.5, groundY);
        ctx.quadraticCurveTo(width * 0.73, groundY - 68, width, groundY - 8);
        ctx.lineTo(width, groundY + 40);
        ctx.lineTo(0, groundY + 40);
        ctx.closePath();
        ctx.fill();
      }

      function drawGround() {
        ctx.fillStyle = night ? "#293844" : "#f4d69b";
        ctx.fillRect(0, groundY, width, height - groundY);

        ctx.strokeStyle = night ? "#d4d5c9" : "#45453e";
        ctx.lineWidth = 2;
        ctx.setLineDash([9, 13]);
        ctx.lineDashOffset = -(distance % 22);
        ctx.beginPath();
        ctx.moveTo(0, groundY + 1);
        ctx.lineTo(width, groundY + 1);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.strokeStyle = night ? "rgba(212,213,201,.3)" : "rgba(69,69,62,.22)";
        ctx.lineWidth = 1;
        ctx.lineDashOffset = -(distance * 0.6 % 45);
        ctx.setLineDash([3, 20]);
        ctx.beginPath();
        ctx.moveTo(0, groundY + 27);
        ctx.lineTo(width, groundY + 27);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawPlayer() {
        const x = player.x;
        const y = player.y;
        const h = player.height;
        const color = night ? "#f7f0d0" : "#242b32";

        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (player.ducking) {
          ctx.beginPath();
          ctx.roundRect(x + 4, y + 9, 39, 20, 8);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(x + 42, y + 11, 10, 0, TAU);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(x + 10, y + 27);
          ctx.lineTo(x + 4, y + 34);
          ctx.moveTo(x + 29, y + 27);
          ctx.lineTo(x + 36, y + 34);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.roundRect(x + 10, y + 15, 29, 30, 7);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(x + 32, y + 12, 13, 0, TAU);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(x + 13, y + 39);
          ctx.lineTo(x + 8, y + 48);
          ctx.moveTo(x + 28, y + 40);
          ctx.lineTo(x + 35, y + 48);
          ctx.moveTo(x + 12, y + 22);
          ctx.lineTo(x + 1, y + 28);
          ctx.stroke();
        }

        ctx.fillStyle = night ? "#293844" : "#f4d69b";
        ctx.beginPath();
        ctx.arc(x + 37, y + 9, 2.5, 0, TAU);
        ctx.fill();

        ctx.restore();
      }

      function drawCactus(obstacle) {
        const x = obstacle.x;
        const y = obstacle.y;
        const w = obstacle.width;
        const h = obstacle.height;
        const color = night ? "#c6d3a8" : "#40715a";

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x + w * 0.28, y, w * 0.44, h, 5);
        ctx.roundRect(x, y + h * 0.42, w * 0.38, h * 0.14, 5);
        ctx.roundRect(x, y + h * 0.25, w * 0.16, h * 0.3, 5);
        ctx.roundRect(x + w * 0.62, y + h * 0.3, w * 0.38, h * 0.14, 5);
        ctx.roundRect(x + w * 0.84, y + h * 0.13, w * 0.16, h * 0.31, 5);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,.23)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.5, y + 7);
        ctx.lineTo(x + w * 0.5, y + h - 7);
        ctx.stroke();
      }

      function drawBird(obstacle) {
        const flap = Math.sin(obstacle.phase) * 4;
        const x = obstacle.x;
        const y = obstacle.y;
        const color = night ? "#e9ddbd" : "#3a4549";

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.arc(x + 24, y + 14, 8, 0, TAU);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x + 18, y + 13);
        ctx.quadraticCurveTo(x + 8, y + 5 + flap, x, y + 14);
        ctx.moveTo(x + 27, y + 13);
        ctx.quadraticCurveTo(x + 38, y + 5 - flap, x + 49, y + 14);
        ctx.stroke();

        ctx.fillStyle = night ? "#293844" : "#f4d69b";
        ctx.beginPath();
        ctx.arc(x + 27, y + 11, 1.6, 0, TAU);
        ctx.fill();
      }

      function drawParticles() {
        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life * 2);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
        }
        ctx.globalAlpha = 1;
      }

      function playSound(type) {
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const now = audioContext.currentTime;

          oscillator.type = "square";
          oscillator.frequency.value =
            type === "jump" ? 480 :
            type === "hit" ? 90 :
            260;

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (type === "hit" ? 0.24 : 0.1));

          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.25);
        } catch {
          // Audio is optional and may be unavailable in restricted browsers.
        }
      }

      function loop(timestamp) {
        const dt = Math.min(0.035, (timestamp - lastTime) / 1000 || 0);
        lastTime = timestamp;

        if (state === "running") update(dt);
        draw();

        animationFrame = requestAnimationFrame(loop);
      }

      startButton.addEventListener("click", () => {
        if (state === "paused") {
          state = "running";
          hideOverlay();
        } else {
          startGame();
        }
      });

      canvas.addEventListener("pointerdown", event => {
        event.preventDefault();
        jump();
      });

      window.addEventListener("keydown", event => {
        if (["Space", "ArrowUp", "KeyW"].includes(event.code)) {
          event.preventDefault();
          jump();
        }

        if (["ArrowDown", "KeyS"].includes(event.code)) {
          event.preventDefault();
          setDuck(true);
        }

        if (event.code === "KeyP") {
          event.preventDefault();
          togglePause();
        }

        if (event.code === "Enter" && (state === "ready" || state === "gameover")) {
          startGame();
        }
      });

      window.addEventListener("keyup", event => {
        if (["ArrowDown", "KeyS"].includes(event.code)) {
          setDuck(false);
        }
      });

      window.addEventListener("resize", resize);

      resize();
      player.y = groundY - player.height;
      showOverlay("ready");
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(loop);
    })();
  </script>
